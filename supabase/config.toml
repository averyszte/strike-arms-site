# Supabase project configuration
# See https://supabase.com/docs/guides/cli/config for all options

project_id = "cxnhkgndvzgyqhiwsvrr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://cxnhkgndvzgyqhiwsvrr.supabase.co",
  "http://localhost:5173/account/**",
  "http://localhost:5173/admin/reset-password",
]
jwt_expiry = 3600
# Customer accounts (034). Admins are still invited, never signed up.
enable_signup = true
# Mirrored in src/lib/password-policy.ts so the forms can say what is wrong
# before Supabase refuses. This file sets it for the local stack only: on the
# hosted project it is Authentication > Sign In / Providers > Email, and
# docs/admin-auth-emails.md lists the values.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

# A new account must confirm its email before it can sign in, and before
# claim_my_guest_orders() will link any guest orders to it.
[auth.email]
enable_confirmations = true

# Every link carries a token_hash that the site redeems itself, rather than
# Supabase's default link, which signs the user in on whatever page the Site
# URL points at. Reset and confirm also carry a 6-digit code, and link to the
# page the request came from ({{ .RedirectTo }}), which must be on the
# redirect allow-list. Local stack only, like the policy above; the hosted
# project needs the same HTML pasted in -- see docs/admin-auth-emails.md.
[auth.email.template.invite]
subject = "Your Strike Arms admin invite"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Strike Arms password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your Strike Arms account"
content_path = "./supabase/templates/confirmation.html"

# Product images live in the product-images bucket created by migration 011.
# The per-file cap here is the local API's ceiling; the bucket sets its own
# 5 MiB limit, which is the one that applies in production.
[storage]
enabled = true
file_size_limit = "10MiB"

# Edge Functions.
#
# verify_jwt = false means the Supabase gateway will not demand a Supabase JWT
# before the function runs. Both of these are called by parties that do not
# have one: an anonymous shopper, and Stripe's servers. Each function does its
# own authentication instead — the checkout endpoint by validating the request
# and pricing from the database, the webhook by verifying the Stripe signature.
[functions.create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# The success page asks whether its order is paid. Its authentication is
# holding both the order id and the Stripe session id, and it answers with
# two fields (see the function).
[functions.checkout-status]
verify_jwt = false

# Guest order lookup for /account. Called by anon shoppers with an order
# number and email; it checks both itself and returns no contact details
# (see the function).
[functions.order-lookup]
verify_jwt = false

# The contact and service quote forms. Called by anon visitors; guarded by
# Turnstile and rate limits instead (see the function).
[functions.submit-inquiry]
verify_jwt = false

# The refund endpoint is called by an admin in a browser, so the gateway
# checks the JWT and the function then requires is_admin_aal2() on top -- a
# valid customer session gets past the gateway and no further.
[functions.refund-order]
verify_jwt = true

# The orphan-image sweeper is the exception: it is maintenance, not a public
# endpoint, so the gateway checks the JWT and the function then requires the
# service role on top. Nothing a browser holds gets past either check.
[functions.sweep-orphan-images]
verify_jwt = true

# A customer deleting their own account. The gateway checks the JWT; the
# function then checks the password again and refuses admin accounts.
[functions.delete-account]
verify_jwt = true

# The notification worker is maintenance in the same way: pg_cron calls it
# with the service role key from Vault (030), and nothing else may.
[functions.notification-worker]
verify_jwt = true
