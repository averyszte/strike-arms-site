# Supabase project configuration
# See https://supabase.com/docs/guides/cli/config for all options

project_id = "cxnhkgndvzgyqhiwsvrr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://cxnhkgndvzgyqhiwsvrr.supabase.co"]
jwt_expiry = 3600
enable_signup = false
# Mirrored in src/lib/password-policy.ts so the forms can say what is wrong
# before Supabase refuses. This file sets it for the local stack only: on the
# hosted project it is Authentication > Sign In / Providers > Email, and
# docs/admin-auth-emails.md lists the values.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

# Both links carry a token_hash that the site redeems itself, rather than
# Supabase's default link, which signs the user in on whatever page the Site
# URL points at. Local stack only, like the policy above; the hosted project
# needs the same HTML pasted in -- see docs/admin-auth-emails.md.
[auth.email.template.invite]
subject = "Your Strike Arms admin invite"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Strike Arms admin password"
content_path = "./supabase/templates/recovery.html"

# Product images live in the product-images bucket created by migration 011.
# The per-file cap here is the local API's ceiling; the bucket sets its own
# 5 MiB limit, which is the one that applies in production.
[storage]
enabled = true
file_size_limit = "10MiB"

# Edge Functions.
#
# verify_jwt = false means the Supabase gateway will not demand a Supabase JWT
# before the function runs. Both of these are called by parties that do not
# have one: an anonymous shopper, and Stripe's servers. Each function does its
# own authentication instead — the checkout endpoint by validating the request
# and pricing from the database, the webhook by verifying the Stripe signature.
[functions.create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# The refund endpoint is called by an admin in a browser, so the gateway
# checks the JWT and the function then requires is_admin_aal2() on top -- a
# valid customer session gets past the gateway and no further.
[functions.refund-order]
verify_jwt = true

# The orphan-image sweeper is the exception: it is maintenance, not a public
# endpoint, so the gateway checks the JWT and the function then requires the
# service role on top. Nothing a browser holds gets past either check.
[functions.sweep-orphan-images]
verify_jwt = true
